master_adapter_path: "path/to/reasoning_math_lora"
plugin_adapter_paths:
  - "path/to/code_python_lora"

output_dir: "./outputs/merged_reasoning_code"

# Projection Hyperparameters
# energy_threshold: 1.0 preserves 100% of Master singular directions for zero degradation;
# values < 1.0 (such as 0.99) trade slight protection for extra plugin capacity.
energy_threshold: 1.0
rank_k: null
project_left: true
project_right: true
plugin_weights:
  - 1.0

target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

export_adapter: true
lora_alpha: 32.0
device: "cpu"
dtype: "float32"
