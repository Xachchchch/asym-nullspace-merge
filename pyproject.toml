[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asym-nsp"
version = "0.1.0"
description = "Asymmetric Null-Space Projection for Data-Free Zero-Interference LoRA Merging"
readme = "README.md"
authors = [
    { name = "Khachik Blbulyan" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "safetensors>=0.4.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
eval = [
    "lm-eval>=0.4.0",
    "datasets>=2.14.0",
    "accelerate>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["src"]
